# GitLab runner 当前未注册。为避免每次 push 产生 stuck/no-runner 的红流水线：
# - 默认不创建自动 pipeline；
# - 注册 runner 后，在 GitLab UI 手动 Run pipeline，并设置 RUN_GITLAB_CI=1。
# GitHub Actions 仍会自动运行（见 .github/workflows/ci.yml）。
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_GITLAB_CI == "1"'
      when: always
    - when: never

stages:
  - test

default:
  image: node:20-bookworm
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq python3 git >/dev/null
    - node --version
    - python3 --version
    - bash --version | head -1

test:
  stage: test
  timeout: 20m
  script:
    - npm test
    - ws="$(mktemp -d)/ws"
    - bash install.sh init "$ws"
    - cd "$ws/.dsh-memory"
    - bash scripts/selfcheck.sh
    - env -u LANG -u LC_CTYPE LC_ALL=C bash scripts/selfcheck.sh
